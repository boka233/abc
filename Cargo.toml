[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.8"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Dodobird Infrastructure"]
repository = "https://github.com/dodobird/tunnel"

[workspace.dependencies]
# --- async runtime ---
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "macros",
    "fs",
    "process",
] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# --- tls ---
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rustls-native-certs = "0.8"

# --- net / bytes ---
bytes = "1"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"

# --- serde / config ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
humantime-serde = "1"

# --- web ---
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }

# --- storage ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "derive",
    "chrono",
    "json",
] }

# --- crypto / auth ---
argon2 = "0.5"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
rand = "0.8"

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# --- utils ---
thiserror = "2"
anyhow = "1"
dashmap = "6"
arc-swap = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# --- internal ---
tunnel-common = { path = "crates/tunnel-common" }
tunnel-protocol = { path = "crates/tunnel-protocol" }
tunnel-core = { path = "crates/tunnel-core" }
tunnel-storage = { path = "crates/tunnel-storage" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
