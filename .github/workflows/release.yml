name: Release

on:
  push:
    tags:
      - 'v*'   # 例如 v0.1.0
  # 允许手工触发，用于验证发布流程本身而不真的打 tag。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建发布包
    runs-on: ubuntu-latest
    # 在 Debian 12 容器里构建，而不是直接用 runner 的系统。
    #
    # 动态链接的二进制要求的 glibc 版本由**构建机**决定。ubuntu-latest 升到 24.04
    # （glibc 2.39）之后，发布出来的 agent 在 Debian 12（glibc 2.36）上连 --version
    # 都跑不起来 —— v0.1.5、v0.1.6 就是这样坏的，代码本身没有任何改动。
    #
    # rust:1-bookworm 就是 Dockerfile 构建镜像用的那一个，已经证明能编过整个 workspace。
    # Rust 版本跟随最新稳定版：依赖的 MSRV 会随 cargo update 往上走（见 Dockerfile）。
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          # release.sh 要读 git sha 写进 BUILD-INFO。
          fetch-depth: 0

      # 仓库目录在容器里属于另一个 uid，git 会拒绝操作并报 dubious ownership，
      # release.sh 读 git sha 与 dirty 状态时就会拿到错误结果。
      - name: 标记仓库目录为可信
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 添加 aarch64 编译目标
        run: rustup target add aarch64-unknown-linux-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ring 与 libsqlite3-sys 含 C 代码，交叉编译到 aarch64 需要目标平台的 C 工具链。
      # 容器里以 root 运行，不需要 sudo。
      - name: 安装 aarch64 交叉工具链
        run: |
          apt-get update -qq
          apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      # release.sh 自己会跑 cargo test --workspace；测试不过就不出包。
      - name: 构建两个架构的发布包
        run: ./scripts/release.sh --arch both

      - name: 列出产物
        run: |
          ls -la dist/
          echo '--- BUILD-INFO ---'
          cat dist/*/BUILD-INFO

      # tag 触发时发 Release；手工触发时只上传 artifact 供下载检查。
      #
      # 除了 tar 包，还单独挂裸二进制与各自的 .sha256 —— 一键部署脚本只需要
      # agent 一个文件，下载整个包再解开是浪费。文件名格式固定为
      # tunnel-agent-<arch>，scripts/docker-deploy.sh 按这个名字去取。
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/tunnel-control-x86_64
            dist/tunnel-control-x86_64.sha256
            dist/tunnel-control-aarch64
            dist/tunnel-control-aarch64.sha256
            dist/tunnel-agent-x86_64
            dist/tunnel-agent-x86_64.sha256
            dist/tunnel-agent-aarch64
            dist/tunnel-agent-aarch64.sha256
          generate_release_notes: true
          body: |
            ## 一条命令部署（全新机器）

            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/quick-install.sh)
            ```

            ## 或用发布包安装

            ```bash
            tar xzf tunnel-<版本>-<架构>.tar.gz
            cd tunnel-<版本>-<架构>
            sha256sum -c SHA256SUMS      # 校验完整性
            sudo ./install.sh control    # 控制面 + 面板
            sudo ./install.sh agent      # 仅数据面
            ```

            包内已含编译好的二进制，目标机器不需要 Rust 或 Node.js。
            安装控制面时会自动把 agent 二进制放进 `agent_binary_dir`，
            面板上的一键对接命令随即可用。

            升级顺序与回滚见 `docs/release.md`。

      - name: 上传构建产物（手工触发时）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*.tar.gz
          retention-days: 7
